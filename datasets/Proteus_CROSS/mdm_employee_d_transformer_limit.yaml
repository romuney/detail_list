sql: "{% macro apply_filters(fields) %}\n  {% for field in fields %}\n    {% set filter_val\
  \ = filter_values(field) %}\n    {{ ' and ' + field + ' in ' + filter_val|where_in\
  \ if filter_val else '' }}\n  {% endfor %}\n{% endmacro %}\n\n{% macro apply_regional_hr_filter()\
  \ %}\n  {% set filters = get_filters('regional_hr_login', remove_filter=True) %}\n\
  \  {% for f in filters %}\n    {% if f.val %}\n      and hasAny(\n        login_reg_hr_list,\n\
  \        [\n          {% for v in f.val %}\n            '{{ v | replace(\"'\", \"\
  ''\") }}'{% if not loop.last %}, {% endif %}\n          {% endfor %}\n        ]\n\
  \      )\n    {% endif %}\n  {% endfor %}\n{% endmacro %}\n\n{% set filters = [\n\
  \    'mdm_employee_rk'\n  , 'ad_login'\n  , 'employee_main_work_no'\n  , 'employment_relation_type_desc'\n\
  \  , 'employee_status_desc'\n  , 'active_type_nm'\n  , 'employee_contract_type_desc'\n\
  \  , 'residential_state_nm'\n  , 'office_desc'\n  , 'emp_specialization_oper_code'\n\
  \  , 'emp_specialization_it_code'\n  , 'emp_stream_desc'\n  , 'emp_specialization_desc'\n\
  \  , 'lvl3_mapped_management_unit_nm'\n  , 'lvl4_mapped_management_unit_nm'\n  ,\
  \ 'lvl5_mapped_management_unit_nm'\n  , 'lvl6_mapped_management_unit_nm'\n  , 'lvl7_mapped_management_unit_nm'\n\
  \  , 'lvl8_mapped_management_unit_nm'\n  , 'lvl9_mapped_management_unit_nm'\n  ,\
  \ 'lvl10_mapped_management_unit_nm'\n  , 'lvl11_mapped_management_unit_nm'\n  ,\
  \ 'lvl12_mapped_management_unit_nm'\n  , 'lvl13_mapped_management_unit_nm'\n  ,\
  \ 'management_head_flg'\n  , 'hrbp_login'\n  , 'lvl1_legal_unit_nm'\n  , 'lvl2_legal_unit_nm'\n\
  \  , 'lvl3_legal_unit_nm'\n  , 'lvl4_legal_unit_nm'\n  , 'lvl5_legal_unit_nm'\n\
  \  , 'lvl6_legal_unit_nm'\n  , 'lvl7_legal_unit_nm'\n  , 'party_id'\n  , 'employee_main_contract_type_nm'\n\
  \  , 'mapping_channel_name'\n  , 'respond_source_nm'\n  , 't_education_desc'\n \
  \ , 'company_fire_flg'\n  , 'rb_flg'\n  , 'rb_migration_flg'\n  , 'legal_position_nm'\n\
  \  , 'location_type'\n  , 'macroregion_nm'\n  , 'city_nm'\n  , 'tcr_exist_flg'\n\
  \  , 'subordination_lvl'\n  , 'head_lvl_segment'\n] %}\n\n{% set functional_filters\
  \ = [\n    'lvl1_functional_unit_nm', 'lvl2_functional_unit_nm', 'lvl3_functional_unit_nm',\n\
  \    'lvl4_functional_unit_nm', 'lvl5_functional_unit_nm', 'lvl6_functional_unit_nm',\n\
  \    'lvl7_functional_unit_nm', 'lvl8_functional_unit_nm', 'lvl9_functional_unit_nm',\n\
  \    'lvl10_functional_unit_nm', 'lvl11_functional_unit_nm', 'lvl12_functional_unit_nm'\n\
  ] %}\n\nwith (\nselect (mdm_employee_rk\n  , ad_login\n  , first_nm\n  , management_unit_nm\n\
  \  , warden_cross_data_flg\n  \n  , personal_management_unit_rk_list\n  , personal_exception_management_unit_rk_list\n\
  \  , personal_legal_unit_rk_list\n  , personal_functional_unit_rk_list\n  , personal_exception_mdm_employee_rk_list\n\
  \n  , grade_management_unit_rk_list\n  , grade_exception_management_unit_rk_list\n\
  \  , grade_legal_unit_rk_list\n  , grade_functional_unit_rk_list\n  , grade_exception_mdm_employee_rk_list\n\
  \n  , seniority_management_unit_rk_list\n  , seniority_exception_management_unit_rk_list\n\
  \  , seniority_legal_unit_rk_list\n  , seniority_exception_mdm_employee_rk_list\n\
  \n  , review_management_unit_rk_list\n  , review_exception_management_unit_rk_list\n\
  \  , review_legal_unit_rk_list\n  , review_functional_unit_rk_list\n  , review_exception_mdm_employee_rk_list\n\
  \n  , warden_support_gph_flg\n\n  , profession_array_nm\n  )\nfrom prod_proteus.warden_access_array_cross\n\
  where 1=1\n  and ad_login = lower('{{ current_username()}}')\n) as warden_array\n\
  \n{% if filter_values('new_functional_unit_nm')|length > 0 %}\n, (\nselect \n( groupArray((functional_unit_rk))\n\
  )\nfrom prod_proteus.cross_filter_functional_structure\nwhere 1=1\nand new_functional_unit_nm\
  \ in ({{ \"'\" + \"', '\".join(filter_values('new_functional_unit_nm')) + \"'\"\
  \ }})\n) as kp_structure\n{% endif %} \n\n{% if filter_values('new_management_unit_nm')|length\
  \ > 0 %}\n, (\nselect \n( groupArray((management_unit_rk))\n)\nfrom prod_proteus.cross_filter_management_structure\n\
  where 1=1\nand new_management_unit_nm in ({{ \"'\" + \"', '\".join(filter_values('new_management_unit_nm'))\
  \ + \"'\" }})\n) as mu_structure\n{% endif %} \n\n{% if filter_values('new_legal_unit_nm')|length\
  \ > 0 %}\n, (\nselect \n( groupArray((legal_unit_rk))\n)\nfrom prod_proteus.cross_filter_legal_structure\n\
  where 1=1\nand new_legal_unit_nm in ({{ \"'\" + \"', '\".join(filter_values('new_legal_unit_nm'))\
  \ + \"'\" }})\n) as lu_structure\n{% endif %} \n\nselect\n  mdm_employee_rk\n  ,\
  \ employee_link as \"\u0421\u0441\u044B\u043B\u043A\u0430_\u043D\u0430_\u043C\u0430\
  \u0439\u0442\u0438\"\n  , company_hire_dt as \"\u0414\u0430\u0442\u0430_\u043D\u0430\
  \u0439\u043C\u0430_\u0432_\u043A\u043E\u043C\u043F\u0430\u043D\u0438\u044E\"\n \
  \ , toYear(toDate(now())) as current_year\n  , warden_first_nm\n  , array_functional_unit_rk\n\
  --\u041F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0435 \u0434\
  \u0430\u043D\u043D\u044B\u0435 \n  , {% if '\u0424\u0430\u043C\u0438\u043B\u0438\
  \u044F' in filter_values('value_attr')%} last_nm {% else %} '   ' {% endif %} as\
  \ \"\u0424\u0430\u043C\u0438\u043B\u0438\u044F\"\n  , {% if '\u0418\u043C\u044F\
  ' in filter_values('value_attr')%} first_nm {% else %} '   ' {% endif %} as \"\u0418\
  \u043C\u044F\"\n  , {% if '\u041F\u043E\u043B\u043D\u043E\u0435 \u0424\u0418\u041E\
  ' in filter_values('value_attr')%} full_nm {% else %} '   ' {% endif %} as \"\u041F\
  \u043E\u043B\u043D\u043E\u0435_\u0424\u0418\u041E\"\n  , {% if '\u0414\u0430\u0442\
  \u0430 \u0440\u043E\u0436\u0434\u0435\u043D\u0438\u044F' in filter_values('value_attr')%}\
  \ birth_dt {% else %} '   ' {% endif %} as \"\u0414\u0430\u0442\u0430_\u0440\u043E\
  \u0436\u0434\u0435\u043D\u0438\u044F\"\n  , {% if '\u0414\u0435\u043D\u044C \u0440\
  \u043E\u0436\u0434\u0435\u043D\u0438\u044F' in filter_values('value_attr')%} toString(birth_day)\
  \ {% else %} '   ' {% endif %} as \"\u0414\u0435\u043D\u044C_\u0440\u043E\u0436\u0434\
  \u0435\u043D\u0438\u044F\"\n  , {% if '\u041C\u0435\u0441\u044F\u0446 \u0440\u043E\
  \u0436\u0434\u0435\u043D\u0438\u044F' in filter_values('value_attr')%} toString(birth_month)\
  \ {% else %} '   ' {% endif %} as \"\u041C\u0435\u0441\u044F\u0446_\u0440\u043E\u0436\
  \u0434\u0435\u043D\u0438\u044F\"\n\n  , {% if '\u0422\u0438\u043F \u0434\u043E\u043A\
  \u0443\u043C\u0435\u043D\u0442\u0430' in filter_values('value_attr')%} employee_document_type_desc\
  \ {% else %} '   ' {% endif %} as \"\u0422\u0438\u043F_\u0434\u043E\u043A\u0443\u043C\
  \u0435\u043D\u0442\u0430\"\n  , {% if '\u0421\u0442\u0440\u0430\u043D\u0430 \u0433\
  \u0440\u0430\u0436\u0434\u0430\u043D\u0441\u0442\u0432\u0430' in filter_values('value_attr')\
  \ %} citizenship_country_desc {% else %} '   ' {% endif %} as \"\u0421\u0442\u0440\
  \u0430\u043D\u0430_\u0433\u0440\u0430\u0436\u0434\u0430\u043D\u0441\u0442\u0432\u0430\
  \"\n  , {% if '\u0420\u0435\u0433\u0438\u043E\u043D \u0440\u0435\u0433\u0438\u0441\
  \u0442\u0440\u0430\u0446\u0438\u0438' in filter_values('value_attr') %} registration_state_nm\
  \ {% else %} '   ' {% endif %} as \"\u0420\u0435\u0433\u0438\u043E\u043D_\u0440\u0435\
  \u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438\"\n  , {% if '\u0413\u043E\
  \u0440\u043E\u0434 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438\
  ' in filter_values('value_attr') %} registration_city_nm  {% else %} '   ' {% endif\
  \ %} as \"\u0413\u043E\u0440\u043E\u0434_\u0440\u0435\u0433\u0438\u0441\u0442\u0440\
  \u0430\u0446\u0438\u0438\"\n  , {% if '\u0420\u0435\u0433\u0438\u043E\u043D \u043F\
  \u0440\u043E\u0436\u0438\u0432\u0430\u043D\u0438\u044F' in filter_values('value_attr')\
  \ %} residential_state_nm {% else %} '   ' {% endif %} as \"\u0420\u0435\u0433\u0438\
  \u043E\u043D_\u043F\u0440\u043E\u0436\u0438\u0432\u0430\u043D\u0438\u044F\"\n  ,\
  \ {% if '\u0413\u043E\u0440\u043E\u0434 \u043F\u0440\u043E\u0436\u0438\u0432\u0430\
  \u043D\u0438\u044F' in filter_values('value_attr') %} city_nm {% else %} '   ' {%\
  \ endif %} as \"\u0413\u043E\u0440\u043E\u0434_\u043F\u0440\u043E\u0436\u0438\u0432\
  \u0430\u043D\u0438\u044F\"\n  , {% if '\u0421\u0435\u043C\u0435\u0439\u043D\u043E\
  \u0435 \u043F\u043E\u043B\u043E\u0436\u0435\u043D\u0438\u0435' in filter_values('value_attr')\
  \ %} marital_status_desc {% else %} '   ' {% endif %} as \"\u0421\u0435\u043C\u0435\
  \u0439\u043D\u043E\u0435_\u043F\u043E\u043B\u043E\u0436\u0435\u043D\u0438\u0435\"\
  \n  , {% if '\u041F\u043E\u043B' in filter_values('value_attr') %} gender_desc {%\
  \ else %} '   ' {% endif %} as \"\u041F\u043E\u043B\"\n  , {% if '\u041D\u043E\u043C\
  \u0435\u0440 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0430' in filter_values('value_attr')\
  \ %} contact_main_phone_no {% else %} '   ' {% endif %} as \"\u041D\u043E\u043C\u0435\
  \u0440_\u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0430\"\n  , {% if '\u041B\u0438\
  \u0447\u043D\u0430\u044F \u043F\u043E\u0447\u0442\u0430' in filter_values('value_attr')\
  \ %} prs_email_address_txt {% else %} '   ' {% endif %} as \"\u041B\u0438\u0447\u043D\
  \u0430\u044F_\u043F\u043E\u0447\u0442\u0430\"\n  \n  , {% if '\u0413\u043E\u0440\
  \u043E\u0434 \u043E\u0442\u043F\u0440\u0430\u0432\u043A\u0438 \u0434\u043E\u043A\
  \u0443\u043C\u0435\u043D\u0442\u043E\u0432 \u0438\u0437 1\u0421' in filter_values('value_attr')\
  \ %} doc_city_nm {% else %} '   ' {% endif %} as \"\u0413\u043E\u0440\u043E\u0434\
  _\u043E\u0442\u043F\u0440\u0430\u0432\u043A\u0438_\u0434\u043E\u043A\u0443\u043C\
  \u0435\u043D\u0442\u043E\u0432_\u0438\u0437_1\u0421\"\n  , {% if '\u041F\u043E\u043B\
  \u043D\u044B\u0439 \u0430\u0434\u0440\u0435\u0441 \u043F\u0440\u043E\u0436\u0438\
  \u0432\u0430\u043D\u0438\u044F' in filter_values('value_attr') %} residential_full_address_txt\
  \ {% else %} '   ' {% endif %} as \"\u041F\u043E\u043B\u043D\u044B\u0439_\u0430\u0434\
  \u0440\u0435\u0441_\u043F\u0440\u043E\u0436\u0438\u0432\u0430\u043D\u0438\u044F\"\
  \n  , {% if '\u041F\u043E\u043B\u043D\u044B\u0439 \u0430\u0434\u0440\u0435\u0441\
  \ \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438' in filter_values('value_attr')\
  \ %} registration_full_address_txt {% else %} '   ' {% endif %} as \"\u041F\u043E\
  \u043B\u043D\u044B\u0439_\u0430\u0434\u0440\u0435\u0441_\u0440\u0435\u0433\u0438\
  \u0441\u0442\u0440\u0430\u0446\u0438\u0438\"\n\n--\u0410\u0442\u0440\u0438\u0431\
  \u0443\u0442\u044B \u0441\u043E\u0442\u0440\u0443\u0434\u043D\u0438\u043A\u0430\n\
  \  , {% if '\u041E\u0444\u0438\u0441' in filter_values('value_attr') %} office_desc\
  \ {% else %} '   ' {% endif %} as \"\u041E\u0444\u0438\u0441\"\n  , {% if '\u041B\
  \u043E\u0433\u0438\u043D' in filter_values('value_attr') %} ad_login {% else %}\
  \ '   ' {% endif %} as \"\u041B\u043E\u0433\u0438\u043D\"\n  , {% if '\u0420\u0430\
  \u0431\u043E\u0447\u0430\u044F \u043F\u043E\u0447\u0442\u0430' in filter_values('value_attr')\
