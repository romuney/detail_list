  \ %} as \"\u0421\u0442\u0430\u0436_\u0432_\u0433\u043E\u0434\u0430\u0445\"\n  ,\
  \ {% if '\u0412\u043E\u0437\u0440\u0430\u0441\u0442' in filter_values('value_attr')\
