  \ if filter_values(filter_name) | length %}\n    and x[{{ i }}] in {{ filter_values(filter_name)\
  \ | where_in }}\n    {% endif %}\n    {% endfor %}\n), arrayMap(\n    x -> array(\n\
  \        {% for i in range(1, 12) %}\n        splitByString('<>', ifNull(x, '-'))[{{\
  \ i }}]\n        {% if not loop.last %}, {% endif %}\n        {% endfor %}\n   \
  \ ),\n    splitByString(';', assumeNotNull(functional_lvl_all_array))\n)))\n{% endif\
  \ %}  \n\nand    true\n    {{ apply_filters(filters) }}\n\n--\u043A\u0440\u043E\u0441\
  \u0441-\u0444\u0438\u043B\u044C\u0442\u0440 \u043F\u043E \u041A\u041F\n{% if filter_values('new_functional_unit_nm')|length\
  \ > 0 %}\nand hasAny(kp_structure, splitByString(';', assumeNotNull(array_functional_unit_rk)))\n\
  {% endif %} \n\n--\u043A\u0440\u043E\u0441\u0441-\u0444\u0438\u043B\u044C\u0442\u0440\
  \ \u043F\u043E \u0423\u0421\n{% if filter_values('new_management_unit_nm')|length\
  \ > 0 %}\nand hasAny(mu_structure, [lvl1_mapped_management_unit_rk, lvl2_mapped_management_unit_rk,\
  \ lvl3_mapped_management_unit_rk, lvl4_mapped_management_unit_rk, lvl5_mapped_management_unit_rk,\
  \ lvl6_mapped_management_unit_rk, lvl7_mapped_management_unit_rk, lvl8_mapped_management_unit_rk,\
  \ lvl9_mapped_management_unit_rk, lvl10_mapped_management_unit_rk, lvl11_mapped_management_unit_rk,\
  \ lvl12_mapped_management_unit_rk])\n{% endif %} \n\n--\u043A\u0440\u043E\u0441\u0441\
  -\u0444\u0438\u043B\u044C\u0442\u0440 \u043F\u043E \u042E\u0421\n{% if filter_values('new_legal_unit_nm')|length\
  \ > 0 %}\nand hasAny(lu_structure, [lvl1_legal_unit_rk, lvl2_legal_unit_rk, lvl3_legal_unit_rk,\
  \ lvl4_legal_unit_rk, lvl5_legal_unit_rk, lvl6_legal_unit_rk, lvl7_legal_unit_rk])\n\
  {% endif %}\n\n--\u0444\u0438\u043B\u044C\u0442\u0440 \u043F\u043E \u0440\u0435\u0433\
  \ HR\n{{ apply_regional_hr_filter() }}\n\nlimit 1100\n)"
