  \u0447\u0430\u044F_\u043F\u043E\u0447\u0442\u0430\"\n  , {% if 'WO \u043B\u043E\u0433\
  \u0438\u043D' in filter_values('value_attr') %} wo_employee_login {% else %} ' \
  \  ' {% endif %} as \"WO_\u043B\u043E\u0433\u0438\u043D\"\n  , {% if '\u0420\u0430\
  \u0437\u043C\u0435\u0440 \u043E\u0434\u0435\u0436\u0434\u044B' in filter_values('value_attr')\
  \ %} clothes_size_code {% else %} '   ' {% endif %} as \"\u0420\u0430\u0437\u043C\
  \u0435\u0440_\u043E\u0434\u0435\u0436\u0434\u044B\"\n  , {% if '\u041E\u0441\u043D\
  \u043E\u0432\u043D\u043E\u0439 Siebel_ID' in filter_values('value_attr') %} party_id\
  \ {% else %} '   ' {% endif %} as \"\u041E\u0441\u043D\u043E\u0432\u043D\u043E\u0439\
