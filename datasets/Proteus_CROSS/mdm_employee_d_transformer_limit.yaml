  \u044C\u043D\u0435\u043D\u0438\u044F_\u0438\u0437_\u043A\u043E\u043C\u043F\u0430\
  \u043D\u0438\u0438\"\n  , {% if '\u041E\u0446\u0435\u043D\u043A\u0430 \u0440\u0435\
  \u0432\u044C\u044E' in filter_values('value_attr') %} summary_score {% else %} '\
  \   ' {% endif %} as \"\u041E\u0446\u0435\u043D\u043A\u0430_\u0440\u0435\u0432\u044C\
