sql: "{% macro apply_filters(fields) %}\n  {% for field in fields %}\n    {% set filter_val\
  \ = filter_values(field) %}\n    {{ ' and ' + field + ' in ' + filter_val|where_in\
  \ if filter_val else '' }}\n  {% endfor %}\n{% endmacro %}\n\n{% macro apply_regional_hr_filter()\
  \ %}\n  {% set filters = get_filters('regional_hr_login', remove_filter=True) %}\n\
  \  {% for f in filters %}\n    {% if f.val %}\n      {% set has_empty_marker = '-'\
  \ in f.val %}\n      {% set real_values = f.val | reject('equalto', '-') | list\
  \ %}\n      and (\n        {% if real_values %}\n          hasAny(\n           \
  \ login_reg_hr_list,\n            [\n              {% for v in real_values %}\n\
  \                '{{ v | replace(\"'\", \"''\") }}'{% if not loop.last %}, {% endif\
  \ %}\n              {% endfor %}\n            ]\n          )\n        {% endif %}\n\
  \        {% if real_values and has_empty_marker %} or {% endif %}\n        {% if\
  \ has_empty_marker %}\n          empty(login_reg_hr_list)\n        {% endif %}\n\
  \      )\n    {% endif %}\n  {% endfor %}\n{% endmacro %}\n\n{% set filters = [\n\
  \    'mdm_employee_rk'\n  , 'ad_login'\n  , 'employee_main_work_no'\n  , 'employment_relation_type_desc'\n\
  \  , 'employee_status_desc'\n  , 'active_type_nm'\n  , 'employee_contract_type_desc'\n\
  \  , 'residential_state_nm'\n  , 'office_desc'\n  , 'emp_specialization_oper_code'\n\
  \  , 'emp_specialization_it_code'\n  , 'emp_stream_desc'\n  , 'emp_specialization_desc'\n\
  \  , 'lvl3_mapped_management_unit_nm'\n  , 'lvl4_mapped_management_unit_nm'\n  ,\
  \ 'lvl5_mapped_management_unit_nm'\n  , 'lvl6_mapped_management_unit_nm'\n  , 'lvl7_mapped_management_unit_nm'\n\
  \  , 'lvl8_mapped_management_unit_nm'\n  , 'lvl9_mapped_management_unit_nm'\n  ,\
  \ 'lvl10_mapped_management_unit_nm'\n  , 'lvl11_mapped_management_unit_nm'\n  ,\
  \ 'lvl12_mapped_management_unit_nm'\n  , 'lvl13_mapped_management_unit_nm'\n  ,\
  \ 'management_head_flg'\n  , 'hrbp_login'\n  , 'lvl1_legal_unit_nm'\n  , 'lvl2_legal_unit_nm'\n\
  \  , 'lvl3_legal_unit_nm'\n  , 'lvl4_legal_unit_nm'\n  , 'lvl5_legal_unit_nm'\n\
  \  , 'lvl6_legal_unit_nm'\n  , 'lvl7_legal_unit_nm'\n  , 'party_id'\n  , 'employee_main_contract_type_nm'\n\
  \  , 'mapping_channel_name'\n  , 'respond_source_nm'\n  , 't_education_desc'\n \
  \ , 'company_fire_flg'\n  , 'rb_flg'\n  , 'rb_migration_flg'\n  , 'legal_position_nm'\n\
  \  , 'location_type'\n  , 'macroregion_nm'\n  , 'city_nm'\n  , 'tcr_exist_flg'\n\
  \  , 'subordination_lvl'\n  , 'head_lvl_segment'\n] %}\n\n{% set functional_filters\
  \ = [\n    'lvl1_functional_unit_nm', 'lvl2_functional_unit_nm', 'lvl3_functional_unit_nm',\n\
  \    'lvl4_functional_unit_nm', 'lvl5_functional_unit_nm', 'lvl6_functional_unit_nm',\n\
  \    'lvl7_functional_unit_nm', 'lvl8_functional_unit_nm', 'lvl9_functional_unit_nm',\n\
  \    'lvl10_functional_unit_nm', 'lvl11_functional_unit_nm', 'lvl12_functional_unit_nm'\n\
  ] %}\n\nwith (\nselect (mdm_employee_rk\n  , ad_login\n  , first_nm\n  , management_unit_nm\n\
  \  , warden_cross_data_flg\n  \n  , personal_management_unit_rk_list\n  , personal_exception_management_unit_rk_list\n\
  \  , personal_legal_unit_rk_list\n  , personal_functional_unit_rk_list\n  , personal_exception_mdm_employee_rk_list\n\
  \n  , grade_management_unit_rk_list\n  , grade_exception_management_unit_rk_list\n\
  \  , grade_legal_unit_rk_list\n  , grade_functional_unit_rk_list\n  , grade_exception_mdm_employee_rk_list\n\
  \n  , seniority_management_unit_rk_list\n  , seniority_exception_management_unit_rk_list\n\
  \  , seniority_legal_unit_rk_list\n  , seniority_exception_mdm_employee_rk_list\n\
  \n  , review_management_unit_rk_list\n  , review_exception_management_unit_rk_list\n\
  \  , review_legal_unit_rk_list\n  , review_functional_unit_rk_list\n  , review_exception_mdm_employee_rk_list\n\
  \n  , warden_support_gph_flg\n\n  , profession_array_nm\n  \n-- , calc_final_filter_id\
  \ as quick_filter_id\n-- , calc_final_col as quick_filter_col\n-- , calc_link_value\
  \ as quick_filter_value\n-- , calc_link_label as quick_link_label\n  )\nfrom prod_proteus.warden_access_array_cross\n\
  where 1=1\n  and ad_login = lower('{{ current_username()}}')\n   --and ad_login\
  \ = 'an.a.khokhlova'\n) as warden_array\n\n{% if filter_values('new_functional_unit_nm')|length\
  \ > 0 %}\n, (\nselect \n( groupArray((functional_unit_rk))\n)\nfrom prod_proteus.cross_filter_functional_structure\n\
  where 1=1\nand new_functional_unit_nm in ({{ \"'\" + \"', '\".join(filter_values('new_functional_unit_nm'))\
  \ + \"'\" }})\n) as kp_structure\n{% endif %} \n\n{% if filter_values('new_management_unit_nm')|length\
  \ > 0 %}\n, (\nselect \n( groupArray((management_unit_rk))\n)\nfrom prod_proteus.cross_filter_management_structure\n\
  where 1=1\nand new_management_unit_nm in ({{ \"'\" + \"', '\".join(filter_values('new_management_unit_nm'))\
  \ + \"'\" }})\n) as mu_structure\n{% endif %} \n\n{% if filter_values('new_legal_unit_nm')|length\
  \ > 0 %}\n, (\nselect \n( groupArray((legal_unit_rk))\n)\nfrom prod_proteus.cross_filter_legal_structure\n\
  where 1=1\nand new_legal_unit_nm in ({{ \"'\" + \"', '\".join(filter_values('new_legal_unit_nm'))\
  \ + \"'\" }})\n) as lu_structure\n{% endif %} \n\nselect\n  mdm_employee_rk,\n \
  \ base64Encode(\n    arrayStringConcat(\n      groupArray(\n        toJSONString(\n\
  \          arrayMap(\n            x -> replaceRegexpAll(\n                   replaceAll(replaceAll(replaceAll(x,\n\
  \                     unhex('E280A8'), ' '),\n                     unhex('E280A9'),\
  \ ' '),\n                     unhex('EFBBBF'), ' '),\n                   '[\\x00-\\\
  x1F]', ' '),\n          [\n            ifNull(toString(`mdm_employee_rk`),''),\n\
  \            ifNull(toString(`company_hire_dt`),''),\n\n            -- ===== \u0410\
  \u0442\u0440\u0438\u0431\u0443\u0442 \u0424\u041B =====\n            ifNull(toString(`last_nm`),''),\n\
  \            ifNull(toString(`first_nm`),''),\n            ifNull(toString(`full_nm`),''),\n\
  \            ifNull(toString(`birth_dt`),''),\n            ifNull(toString(`birth_day`),''),\n\
  \            ifNull(toString(`birth_month`),''),\n            ifNull(toString(`mdm_employee_age`),''),\n\
  \            ifNull(toString(`age_generation_nm`),''),\n            ifNull(toString(`contact_main_phone_no`),''),\n\
  \            ifNull(toString(`prs_email_address_txt`),''),\n            ifNull(toString(`employee_document_type_desc`),''),\n\
  \            ifNull(toString(`citizenship_country_desc`),''),\n            ifNull(toString(`registration_state_nm`),''),\n\
  \            ifNull(toString(`registration_city_nm`),''),\n            ifNull(toString(`registration_full_address_txt`),''),\n\
  \            ifNull(toString(`residential_state_nm`),''),\n            ifNull(toString(`city_nm`),''),\n\
  \            ifNull(toString(`residential_full_address_txt`),''),\n            ifNull(toString(`doc_city_nm`),''),\n\
  \            ifNull(toString(`marital_status_desc`),''),\n            ifNull(toString(`gender_desc`),''),\n\
  \            ifNull(toString(`education_degree_unique_max`),''),\n            ifNull(toString(`education_spec_nm`),''),\n\
  \            ifNull(toString(`has_children_flg`),''),\n            ifNull(toString(`location_type`),''),\n\
  \            ifNull(toString(`macroregion_nm`),''),\n\n            -- ===== \u0410\
  \u0442\u0440\u0438\u0431\u0443\u0442 \u0441\u043E\u0442\u0440\u0443\u0434\u043D\u0438\
  \u043A\u0430 =====\n            ifNull(toString(`office_desc`),''),\n          \
  \  ifNull(toString(`ad_login`),''),\n            ifNull(toString(`wo_employee_login`),''),\n\
  \            ifNull(toString(`wrk_email_address_txt`),''),\n            ifNull(toString(`clothes_size_code`),''),\n\
  \            ifNull(toString(`party_id`),''),\n            ifNull(toString(`company_fire_dt`),''),\n\
  \            ifNull(toString(`t_education_desc`),''),\n            ifNull(toString(`work_experience_year`),''),\n\
  \            ifNull(toString(`experience_group_nm`),''),\n            ifNull(toString(`active_type_nm`),''),\n\
  \            ifNull(toString(`seniority`),''),\n            ifNull(toString(`grade`),''),\n\
  \            ifNull(toString(`change_grade_dt_text`),''),\n            ifNull(toString(`change_specialization_dt_text`),''),\n\
  \            ifNull(toString(`change_management_unit_dt_text`),''),\n          \
  \  ifNull(toString(`change_management_head_dt`),''),\n            ifNull(toString(`summary_score`),''),\n\
  \n            -- ===== \u0410\u0442\u0440\u0438\u0431\u0443\u0442 \u042E\u0421 =====\n\
  \            ifNull(toString(`employment_relation_type_desc`),''),\n           \
  \ ifNull(toString(`employee_status_desc`),''),\n            ifNull(toString(`employee_contract_type_desc`),''),\n\
  \            ifNull(toString(`legal_position_nm`),''),\n            ifNull(toString(`employee_main_work_no`),''),\n\
  \            ifNull(toString(`legal_hire_dt`),''),\n            ifNull(toString(`legal_fire_dt`),''),\n\
  \            ifNull(toString(`lvl1_legal_unit_nm`),''),\n            ifNull(toString(`lvl2_legal_unit_nm`),''),\n\
  \            ifNull(toString(`lvl3_legal_unit_nm`),''),\n            ifNull(toString(`lvl4_legal_unit_nm`),''),\n\
  \            ifNull(toString(`lvl5_legal_unit_nm`),''),\n            ifNull(toString(`lvl6_legal_unit_nm`),''),\n\
  \            ifNull(toString(`lvl7_legal_unit_nm`),''),\n            ifNull(toString(`hr_head_nm`),''),\n\
  \            ifNull(toString(`regional_hr_login`),''),\n            ifNull(toString(`hr_head_mdm_employee_rk`),''),\n\
  \            ifNull(toString(`code_1c`),''),\n            ifNull(toString(`employee_main_contract_type_nm`),''),\n\
  \            ifNull(toString(`employee_main_contract_end_dt`),''),\n           \
  \ ifNull(toString(`legal_head_flg`),''),\n            ifNull(toString(`employee_main_schedule_nm`),''),\n\
  \            ifNull(toString(`emp_contract_no`),''),\n\n            -- ===== \u0410\
  \u0442\u0440\u0438\u0431\u0443\u0442 \u0423\u0421 =====\n            ifNull(toString(`lvl3_mapped_management_unit_nm`),''),\n\
  \            ifNull(toString(`lvl4_mapped_management_unit_nm`),''),\n          \
  \  ifNull(toString(`lvl5_mapped_management_unit_nm`),''),\n            ifNull(toString(`lvl6_mapped_management_unit_nm`),''),\n\
  \            ifNull(toString(`lvl7_mapped_management_unit_nm`),''),\n          \
  \  ifNull(toString(`lvl8_mapped_management_unit_nm`),''),\n            ifNull(toString(`lvl9_mapped_management_unit_nm`),''),\n\
  \            ifNull(toString(`lvl10_mapped_management_unit_nm`),''),\n         \
  \   ifNull(toString(`lvl11_mapped_management_unit_nm`),''),\n            ifNull(toString(`mapped_management_unit_nm`),''),\n\
  \            ifNull(toString(`emp_specialization_oper_code`),''),\n            ifNull(toString(`emp_specialization_it_code`),''),\n\
  \            ifNull(toString(`emp_stream_desc`),''),\n            ifNull(toString(`emp_specialization_desc`),''),\n\
  \            ifNull(toString(`management_head_flg`),''),\n            ifNull(toString(`head_lvl_segment`),''),\n\
  \            ifNull(toString(`management_head_nm`),''),\n            ifNull(toString(`head_login`),''),\n\
  \            ifNull(toString(`head_wo_employee_login`),''),\n            ifNull(toString(`head_wrk_email_address_txt`),''),\n\
  \            ifNull(toString(`management_head_mdm_employee_rk`),''),\n         \
  \   ifNull(toString(`hrbp_nm`),''),\n            ifNull(toString(`hrbp_login`),''),\n\
  \            ifNull(toString(`hrbp_mdm_employee_rk`),''),\n            ifNull(toString(`hrap_login`),''),\n\
  \            ifNull(toString(`hrap_mdm_employee_rk`),''),\n            ifNull(toString(`subordination_lvl`),''),\n\
  \n            -- ===== \u041A\u041F (\u0444\u0443\u043D\u043A\u0446\u0438\u043E\u043D\
  \u0430\u043B\u044C\u043D\u044B\u0435) =====\n            ifNull(toString(`employee_link`),''),\n\
  \            ifNull(toString(toYear(toDate(now()))),''),\n            ifNull(toString(`allocation_prt_norm`),''),\n\
  \            ifNull(toString(`lvl1_functional_unit_nm`),''),\n            ifNull(toString(`lvl2_functional_unit_nm`),''),\n\
  \            ifNull(toString(`lvl3_functional_unit_nm`),''),\n            ifNull(toString(`lvl4_functional_unit_nm`),''),\n\
  \            ifNull(toString(`lvl5_functional_unit_nm`),''),\n            ifNull(toString(`lvl6_functional_unit_nm`),''),\n\
  \            ifNull(toString(`lvl7_functional_unit_nm`),''),\n            ifNull(toString(`lvl8_functional_unit_nm`),''),\n\
  \            ifNull(toString(`lvl9_functional_unit_nm`),''),\n            ifNull(toString(`lvl10_functional_unit_nm`),''),\n\
  \            ifNull(toString(`lvl11_functional_unit_nm`),''),\n            ifNull(toString(`lvl12_functional_unit_nm`),'')\n\
  \          ]\n        )\n      )\n    ),\n    ','\n  )\n  ) AS packed_b64\n  , count\
  \ (*) over() as total_cnt\n  , any(warden_array.3) over() as warden_first_nm\n \
  \ -- , any(warden_array.27) over() as quick_filter_id\n  -- , any(warden_array.28)\
  \ over() as quick_filter_col\n  -- , any(warden_array.29) over() as quick_filter_value\n\
  \  -- , any(warden_array.30) over() as quick_link_label\n\nfrom\n   ( select  mdm_employee_rk\n\
  \    , company_hire_dt\n    , employee_document_type_desc\n    , residential_state_nm\n\
  \    , city_nm\n    , residential_city_nm\n    , doc_city_nm\n    , macroregion_nm\n\
  \    , location_type\n    , gender_desc\n    , office_desc\n    , ad_login\n   \
  \ , wrk_email_address_txt\n    , wo_employee_login\n    , clothes_size_code\n  \
  \  , party_id\n    , company_fire_dt\n    , employment_relation_type_desc\n    ,\
  \ employee_status_desc\n    , legal_hire_dt\n    , legal_fire_dt\n    , employee_contract_type_desc\n\
  \    , legal_position_nm\n    , employee_main_work_no\n    , lvl1_legal_unit_nm\n\
  \    , lvl2_legal_unit_nm\n    , lvl3_legal_unit_nm\n    , lvl4_legal_unit_nm\n\
  \    , lvl5_legal_unit_nm\n    , lvl6_legal_unit_nm\n    , lvl7_legal_unit_nm\n\
  \    , legal_head_flg\n    , employee_main_contract_type_nm\n    , employee_main_contract_end_dt\n\
  \    , lvl3_mapped_management_unit_nm\n    , lvl4_mapped_management_unit_nm\n  \
  \  , lvl5_mapped_management_unit_nm\n    , lvl6_mapped_management_unit_nm\n    ,\
  \ lvl7_mapped_management_unit_nm\n    , lvl8_mapped_management_unit_nm\n    , lvl9_mapped_management_unit_nm\n\
  \    , lvl10_mapped_management_unit_nm\n    , lvl11_mapped_management_unit_nm\n\
  \    , mapped_management_unit_nm\n    , emp_specialization_oper_code\n    , emp_specialization_it_code\n\
  \    , emp_stream_desc\n    , emp_specialization_desc\n    , management_head_flg\n\
  \n    , active_type_nm\n    , t_education_desc\n    , employee_link\n    , allocation_prt_norm\n\
  \    , lvl1_functional_unit_nm\n    , lvl2_functional_unit_nm\n    , lvl3_functional_unit_nm\n\
  \    , lvl4_functional_unit_nm\n    , lvl5_functional_unit_nm\n    , lvl6_functional_unit_nm\n\
  \    , lvl7_functional_unit_nm\n    , lvl8_functional_unit_nm\n    , lvl9_functional_unit_nm\n\
  \    , lvl10_functional_unit_nm\n    , lvl11_functional_unit_nm\n    , lvl12_functional_unit_nm\n\
  \    , head_wrk_email_address_txt\n    , experience_group_nm\n    , head_login\n\
  \    , hrbp_login\n    , hrap_login\n    , regional_hr_login\n    , work_experience_year\n\
  \    , code_1c\n    , head_wo_employee_login\n    , birth_day\n    , birth_month\n\
  \    , employee_main_schedule_nm\n    , emp_contract_no\n    , subordination_lvl\n\
  \    , education_degree_unique_max\n    , head_lvl_segment\n    , change_specialization_dt_text\n\
  \    , change_management_unit_dt_text\n    , change_management_head_dt\n    , hrap_mdm_employee_rk\n\
  \    , hrbp_mdm_employee_rk\n    , management_head_mdm_employee_rk\n    , hr_head_mdm_employee_rk\n\
  \    , education_spec_nm\n\n    --\u0432\u0430\u0440\u0434\u0435\u043D \u043F\u043E\
  \ \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u043A\u0435\n    , if (\n   \
  \ \n    warden_array.5=1\n    or\n      case when warden_array.2 in ('an.a.sokolova','r.dorofeev')\
  \ then active_type_nm = '\u0421\u0442\u0430\u0436\u0435\u0440\u044B' else 1!=1 end\
  \ --\u0434\u043E\u0441\u0442\u0443\u043F \u0432 \u0440\u0430\u043C\u043A\u0430\u0445\
  \ \u0437\u0430\u0434\u0430\u0447\u0438 CROSS-8440 \u0438 CROSS-15151\n    or\n \
  \     case when warden_array.2 in ('v.larionova', 'a.tumanik','k.a.chernova','i.lelyuk',\
  \ 'i.s.verbitskaya','k.samolyuk', 'e.tyazheva') then tcr_flg = 1 else 1!=1 end --\u0434\
  \u043E\u0441\u0442\u0443\u043F \u0432 \u0440\u0430\u043C\u043A\u0430\u0445 \u0437\
  \u0430\u0434\u0430\u0447\u0438 CROSS-9940\n    or\n      case when warden_array.25\
  \ =1 then employment_relation_type_desc != '\u0428\u0442\u0430\u0442\u043D\u044B\
  \u0439 \u0441\u043E\u0442\u0440\u0443\u0434\u043D\u0438\u043A' else 1!=1 end --\u0434\
  \u043E\u0441\u0442\u0443\u043F \u0434\u043B\u044F \u043A\u043E\u043C\u0430\u043D\
  \u0434\u044B \u0443\u0447\u0435\u0442\u0430 \u0438\u0441\u043F\u043E\u043B\u043D\
  \u0438\u0442\u0435\u043B\u0435\u0439\n    or\n    hasAny(warden_array.26, profession_nm_array_new)\
  \ --\u0432\u0430\u0440\u0434\u0435\u043D \u0434\u043B\u044F \u043B\u0438\u0434\u0435\
  \u0440\u043E\u0432 \u043F\u0440\u043E\u0444\u0435\u0441\u0441\u0438\u0439\n    or\n\
  \    (hasAny([warden_array.2], login_reg_hr_list)\n    and lvl3_mapped_management_unit_rk\
  \ != 'c10fb1ad1295902238dba3019d92ce41')\n      or\n    (\n    (\n      (\n    \
  \  hasAny(warden_array.6, mapped_management_unit_rk_list)\n      and (not hasAny(warden_array.7,\
  \ mapped_management_unit_rk_list))\n      )\n    or \n      (hasAny(warden_array.8,\
  \ legal_unit_rk_list)\n      )\n    or\n      (hasAny(warden_array.9, functional_unit_rk_list))\n\
  \    )\n    and (not hasAny(warden_array.10, mdm_employee_rk_list)))\n    ,1,0)\
  \ as warden_personal_flg\n    \n    --\u0432\u0430\u0440\u0434\u0435\u043D \u043F\
  \u043E \u0433\u0440\u0435\u0439\u0434\u0443\n    , if (\n    warden_array.5=1\n\
  \    or\n      hasAny(warden_array.26, profession_nm_array_new) --\u0432\u0430\u0440\
  \u0434\u0435\u043D \u0434\u043B\u044F \u043B\u0438\u0434\u0435\u0440\u043E\u0432\
  \ \u043F\u0440\u043E\u0444\u0435\u0441\u0441\u0438\u0439\n    or\n      case when\
  \ warden_array.2 in ('v.larionova', 'a.tumanik','k.a.chernova','i.lelyuk', 'i.s.verbitskaya','k.samolyuk',\
  \ 'e.tyazheva') then tcr_flg = 1 else 1!=1 end --\u0434\u043E\u0441\u0442\u0443\u043F\
  \ \u0432 \u0440\u0430\u043C\u043A\u0430\u0445 \u0437\u0430\u0434\u0430\u0447\u0438\
  \ CROSS-9940\n            or\n      warden_array.2 in ('v.poljakov') and v_poljakov_access_flg\
  \ = 1 --\u0434\u043E\u0441\u0442\u0443\u043F \u0432 \u0440\u0430\u043C\u043A\u0430\
  \u0445 \u0437\u0430\u0434\u0430\u0447\u0438 CROSS-16526\n            or\n      (hasAny([warden_array.2],\
  \ login_reg_hr_list)\n      and lvl3_mapped_management_unit_rk != 'c10fb1ad1295902238dba3019d92ce41')\n\
  \      or\n      (\n    (\n      (\n      hasAny(warden_array.11, mapped_management_unit_rk_list)\n\
  \      and (not hasAny(warden_array.12, mapped_management_unit_rk_list))\n     \
  \ )\n    or \n      (hasAny(warden_array.13, legal_unit_rk_list)\n      )\n    or\n\
  \      (hasAny(warden_array.14, functional_unit_rk_list))\n    )\n    and (not hasAny(warden_array.15,\
