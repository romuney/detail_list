  \u0447\u043D\u0438\u043A' %}\n       respond_source_nm\n       {% elif filter_values('select_param_2')|first\
  \ == '\u0423\u0421-\u0443\u0440\u043E\u0432\u0435\u043D\u044C 2' %}\n       resource_level_2_nm\n\
  \       {% elif filter_values('select_param_2')|first == '\u0423\u0421-\u0443\u0440\
