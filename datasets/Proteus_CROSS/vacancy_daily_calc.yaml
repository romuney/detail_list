sql: "{% macro apply_filters(fields) %}\n  {% for field in fields %}\n    {% set filter_val\
  \ = filter_values(field) %}\n    {{ ' and ' + field + ' in ' + filter_val|where_in\
  \ if filter_val else '' }}\n  {% endfor %}\n{% endmacro %}\n\n\n\n{% set filters\
  \ = [\n  'specialization_group'\n  ,'specialization'\n  ,'mapping_channel_name'\n\
  \  ,'group_mapping_channel_name'\n  ,'mapping_channel_name_for_digest'\n  ,'search_type'\
  \ \n  ,'search_reason' \n  ,'ad_login_recruit' \n  ,'mapping_group_name_history'\
  \ \n  ,'it_flg'\n  , 'emp_specialization_oper_code'\n  ,'tcr_candy' \n  ,'customer'\n\
  \  , 'specialization_group_mapping'\n  , 'close_source_adj'\n  , 'close_type'\n\
  \  , 'close_source'\n  , 'respond_source_nm'\n  , 'source_type'\n  , 'lvl_position_adj'\n\
  \  , 'finalist_level_candy'\n  , 'location'\n  , 'offer_contract_type_cd'\n  , 'mapping_employee_type'\n\
  \  , 'first_event_recrut_ad_login'\n  \n,'lvl1_functional_unit_nm_kp'\n,'lvl2_functional_unit_nm_kp'\n\
  ,'lvl3_functional_unit_nm'\n,'lvl4_functional_unit_nm'\n,'lvl5_functional_unit_nm'\n\
  ,'lvl6_functional_unit_nm'\n,'lvl7_functional_unit_nm'\n,'lvl8_functional_unit_nm'\n\
  ,'lvl9_functional_unit_nm'\n,'lvl10_functional_unit_nm'\n,'lvl11_functional_unit_nm'\n\
  ,'lvl12_functional_unit_nm'\n\n, 'resource_level_3_nm'\n, 'resource_level_4_nm'\n\
  , 'resource_level_5_nm'\n, 'resource_level_6_nm'\n, 'resource_level_7_nm'\n, 'resource_level_8_nm'\n\
  , 'resource_level_9_nm'\n, 'resource_level_10_nm'\n, 'resource_level_11_nm'\n, 'current_empl_status'\n\
  \n\n] %}\nwith (select groupArray((ad_login, ad_group))\n  from prod_proteus.sign_on_rls\n\
  \  where ad_login = '{{  cache_key_wrapper(current_username()) }}'\n  ) as warden_array\n\
  select *\n--, case when '{{cache_key_wrapper(current_username()) }}' in  ('v.sklyarenko',\
  \ 'y.k.bobkova')\n       --then finalist_level_candy else '\u043D\u0435\u0442 \u0434\
  \u0430\u043D\u043D\u044B\u0445' end as finalist_level_candy1\n, case when warden_array[1].2\
  \ = 'super_user' then toString(finalist_grade_candy)\n       when warden_array[1].2\
  \ in ('stream-leads')\n              and specialization_group != '\u0423\u043F\u0440\
  \u0430\u0432\u043B\u0435\u043D\u0438\u0435 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\
  \u043B\u043E\u043C'\n       then toString(finalist_grade_candy) else '\u043D\u0435\
  \u0442 \u0434\u0430\u043D\u043D\u044B\u0445' end as finalist_grade_candy1\n, toString(date_trunc('month',\
  \ closed_plan_day)) as issue_month\n, toString(toYear(closed_plan_day)) as issue_year\n\
  , {% if filter_values('select_param')|first == '\u0421\u043F\u0435\u0446\u0438\u0430\
  \u043B\u0438\u0437\u0430\u0446\u0438\u044F' %}  \n       specialization\n      \
  \ {% elif filter_values('select_param')|first == '\u0421\u0442\u0440\u0438\u043C\
  ' %}  \n       specialization_group\n       {% elif filter_values('select_param')|first\
  \ == '\u041B\u043E\u043A\u0430\u0446\u0438\u044F' %} \n       location\n       {%\
  \ elif filter_values('select_param')|first == '\u0413\u0440\u0443\u043F\u043F\u0430\
  \ \u0441\u043F\u0435\u0446\u0438\u0430\u043B\u0438\u0437\u0430\u0446\u0438\u0439\
  ' %} \n       specialization_group_mapping\n       {% elif filter_values('select_param')|first\
  \ == '\u041A\u0430\u043D\u0430\u043B' %}\n       mapping_channel_name\n       {%\
  \ elif filter_values('select_param')|first == '\u0413\u0440\u0443\u043F\u043F\u0430\
  \ \u043A\u0430\u043D\u0430\u043B\u043E\u0432' %}\n       group_mapping_channel_name\n\
  \       {% elif filter_values('select_param')|first == '\u041A\u0430\u043D\u0430\
  \u043B+Hiring Events' %}\n       mapping_channel_name_he\n       {% elif filter_values('select_param')|first\
  \ == 'HQ/Line/Support' %} \n       emp_specialization_oper_code\n       {% elif\
  \ filter_values('select_param')|first == '\u0423\u0440\u043E\u0432\u0435\u043D\u044C\
  \ \u0444\u0438\u043D\u0430\u043B\u0438\u0441\u0442\u0430' %}\n       finalist_level_candy\
  \ \n       {% elif filter_values('select_param')|first == '\u0423\u0440\u043E\u0432\
  \u0435\u043D\u044C \u0441\u043F\u0435\u0446\u0438\u0430\u043B\u0438\u0441\u0442\u0430\
  ' %}\n       lvl_position_adj \n       {% elif filter_values('select_param')|first\
  \ == '\u0413\u0440\u0435\u0439\u0434 \u0444\u0438\u043D\u0430\u043B\u0438\u0441\u0442\
  \u0430' %}\n       case when warden_array[1].2 = 'super_user' then toString(finalist_grade_candy)\n\
  \       when warden_array[1].2 in ('stream-leads') and specialization_group != '\u0423\
  \u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435 \u043F\u0435\u0440\u0441\u043E\
  \u043D\u0430\u043B\u043E\u043C'\n       then toString(finalist_grade_candy) else\
  \ '\u043D\u0435\u0442 \u0434\u0430\u043D\u043D\u044B\u0445' end\n       {% elif\
  \ filter_values('select_param')|first == 'IT/Digital/NonIT' %}\n       it_flg\n\
  \       {% elif filter_values('select_param')|first == '\u041F\u0440\u0438\u0447\
  \u0438\u043D\u0430 \u043F\u043E\u0438\u0441\u043A\u0430' %}\n       search_reason\n\
  \       {% elif filter_values('select_param')|first == '\u0422\u0438\u043F \u043F\
  \u043E\u0438\u0441\u043A\u0430' %}\n       search_type\n       {% elif filter_values('select_param')|first\
  \ == '\u0422\u0438\u043F \u0437\u0430\u043A\u0440\u044B\u0442\u0438\u044F' %}\n\
  \       close_type\n       {% elif filter_values('select_param')|first == '\u0420\
  \u0435\u043A\u0440\u0443\u0442\u0435\u0440' %}\n       ad_login_recruit\n      \
  \ {% elif filter_values('select_param')|first == '\u0413\u0440\u0443\u043F\u043F\
  \u0430 \u0440\u0435\u043A\u0440\u0443\u0442\u0435\u0440\u043E\u0432' %}\n      \
  \ mapping_group_name_history\n       {% elif filter_values('select_param')|first\
  \ == '\u0413\u0440\u0443\u043F\u043F\u0430 \u0440\u0435\u043A\u0440\u0443\u0442\u0435\
  \u0440\u043E\u0432+\u0421\u043E\u0440\u0441\u0435\u0440\u044B' %}\n       mapping_group_name_with_sorcerer\n\
  \       {% elif filter_values('select_param')|first == '\u0422\u0426\u0420' %}\n\
  \       tcr_candy\n       {% elif filter_values('select_param')|first == '\u0411\
  \u0430\u043A\u0435\u0442\u044B' %}\n       bucket\n       {% elif filter_values('select_param')|first\
  \ == '\u0414\u0435\u0442\u0430\u043B\u044C\u043D\u044B\u0439 \u0438\u0441\u0442\u043E\
  \u0447\u043D\u0438\u043A' %}\n       respond_source_nm\n       {% elif filter_values('select_param')|first\
  \ == '\u0423\u0421-\u0443\u0440\u043E\u0432\u0435\u043D\u044C 2' %}\n       resource_level_2_nm\n\
  \       {% elif filter_values('select_param')|first == '\u0423\u0421-\u0443\u0440\
  \u043E\u0432\u0435\u043D\u044C 3' %}\n        resource_level_3_nm\n       {% elif\
  \ filter_values('select_param')|first == '\u0423\u0421-\u0443\u0440\u043E\u0432\u0435\
  \u043D\u044C 4' %}\n        resource_level_4_nm\n       {% elif filter_values('select_param')|first\
  \ == '\u0423\u0421-\u0443\u0440\u043E\u0432\u0435\u043D\u044C 5' %}\n        resource_level_5_nm\n\
  \       {% elif filter_values('select_param')|first == '\u0423\u0421-\u0443\u0440\
  \u043E\u0432\u0435\u043D\u044C 6' %}\n        resource_level_6_nm\n       {% elif\
  \ filter_values('select_param')|first == '\u0423\u0421-\u0443\u0440\u043E\u0432\u0435\
  \u043D\u044C 7' %}\n        resource_level_7_nm\n       {% elif filter_values('select_param')|first\
  \ == '\u0423\u0421-\u0443\u0440\u043E\u0432\u0435\u043D\u044C 8' %}\n        resource_level_8_nm\n\
  \       {% elif filter_values('select_param')|first == '\u0423\u0421-\u0443\u0440\
  \u043E\u0432\u0435\u043D\u044C 9' %}\n        resource_level_9_nm\n       {% elif\
  \ filter_values('select_param')|first == '\u0423\u0421-\u0443\u0440\u043E\u0432\u0435\
  \u043D\u044C 10' %}\n        resource_level_10_nm\n       {% elif filter_values('select_param')|first\
  \ == '\u0423\u0421-\u0443\u0440\u043E\u0432\u0435\u043D\u044C 11' %}\n        resource_level_11_nm\n\
  \       {% elif filter_values('select_param')|first == '\u041A\u041F-\u0443\u0440\
  \u043E\u0432\u0435\u043D\u044C 1' %}\n        lvl1_functional_unit_nm_kp\n     \
  \  {% elif filter_values('select_param')|first == '\u041A\u041F-\u0443\u0440\u043E\
  \u0432\u0435\u043D\u044C 2' %}\n        lvl2_functional_unit_nm_kp\n        {% elif\
  \ filter_values('select_param')|first == '\u041A\u041F-\u0443\u0440\u043E\u0432\u0435\
  \u043D\u044C 3' %}\n        lvl3_functional_unit_nm\n        {% elif filter_values('select_param')|first\
  \ == '\u041A\u041F-\u0443\u0440\u043E\u0432\u0435\u043D\u044C 4' %}\n        lvl4_functional_unit_nm\n\
  \        {% elif filter_values('select_param')|first == '\u041A\u041F-\u0443\u0440\
  \u043E\u0432\u0435\u043D\u044C 5' %}\n        lvl5_functional_unit_nm\n        {%\
  \ elif filter_values('select_param')|first == '\u041A\u041F-\u0443\u0440\u043E\u0432\
  \u0435\u043D\u044C 6' %}\n        lvl6_functional_unit_nm\n        {% elif filter_values('select_param')|first\
  \ == '\u041A\u041F-\u0443\u0440\u043E\u0432\u0435\u043D\u044C 7' %}\n        lvl7_functional_unit_nm\n\
  \        {% elif filter_values('select_param')|first == '\u041A\u041F-\u0443\u0440\
  \u043E\u0432\u0435\u043D\u044C 8' %}\n        lvl8_functional_unit_nm\n        {%\
  \ elif filter_values('select_param')|first == '\u041A\u041F-\u0443\u0440\u043E\u0432\
  \u0435\u043D\u044C 9' %}\n        lvl9_functional_unit_nm\n        {% elif filter_values('select_param')|first\
  \ == '\u041A\u041F-\u0443\u0440\u043E\u0432\u0435\u043D\u044C 10' %}\n        lvl10_functional_unit_nm\n\
  \        {% elif filter_values('select_param')|first == '\u041A\u041F-\u0443\u0440\
  \u043E\u0432\u0435\u043D\u044C 11' %}\n        lvl11_functional_unit_nm\n      \
  \  {% elif filter_values('select_param')|first == '\u041A\u041F-\u0443\u0440\u043E\
  \u0432\u0435\u043D\u044C 12' %}\n        lvl12_functional_unit_nm\n       {% else\
  \ %}\n       specialization_group\n       {% endif %} as param_1\n  ,{% if filter_values('select_param_2')|first\
  \ == '\u0421\u043F\u0435\u0446\u0438\u0430\u043B\u0438\u0437\u0430\u0446\u0438\u044F\
  ' %}  \n       specialization\n       {% elif filter_values('select_param_2')|first\
  \ == '\u0421\u0442\u0440\u0438\u043C' %}  \n       specialization_group\n      \
  \ {% elif filter_values('select_param_2')|first == '\u041B\u043E\u043A\u0430\u0446\
  \u0438\u044F' %} \n       location\n       {% elif filter_values('select_param_2')|first\
  \ == '\u0413\u0440\u0443\u043F\u043F\u0430 \u0441\u043F\u0435\u0446\u0438\u0430\u043B\
  \u0438\u0437\u0430\u0446\u0438\u0439' %} \n       specialization_group_mapping\n\
