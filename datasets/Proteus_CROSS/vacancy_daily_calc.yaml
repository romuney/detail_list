  \u043B' %}\n       mapping_channel_name\n       {% elif filter_values('select_param_2')|first\
  \ == '\u0413\u0440\u0443\u043F\u043F\u0430 \u043A\u0430\u043D\u0430\u043B\u043E\u0432\
  ' %}\n       group_mapping_channel_name\n       {% elif filter_values('select_param_2')|first\
  \ == '\u041A\u0430\u043D\u0430\u043B+Hiring Events' %}\n       mapping_channel_name_he\n\
  \       {% elif filter_values('select_param2')|first == 'HQ/Line/Support' %} \n\
  \       emp_specialization_oper_code\n       {% elif filter_values('select_param_2')|first\
  \ == '\u0423\u0440\u043E\u0432\u0435\u043D\u044C \u0444\u0438\u043D\u0430\u043B\u0438\
  \u0441\u0442\u0430' %}\n       finalist_level_candy\n       {% elif filter_values('select_param2')|first\
  \ == '\u0423\u0440\u043E\u0432\u0435\u043D\u044C \u0441\u043F\u0435\u0446\u0438\u0430\
  \u043B\u0438\u0441\u0442\u0430' %}\n       lvl_position_adj \n       {% elif filter_values('select_param_2')|first\
  \ == '\u0413\u0440\u0435\u0439\u0434 \u0444\u0438\u043D\u0430\u043B\u0438\u0441\u0442\
  \u0430' %}\n       case when warden_array[1].2 = 'super_user' then toString(finalist_grade_candy)\n\
  \       when warden_array[1].2 in ('stream-leads') and specialization_group != '\u0423\
  \u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435 \u043F\u0435\u0440\u0441\u043E\
  \u043D\u0430\u043B\u043E\u043C'\n       then toString(finalist_grade_candy) else\
  \ '\u043D\u0435\u0442 \u0434\u0430\u043D\u043D\u044B\u0445' end\n       {% elif\
  \ filter_values('select_param_2')|first == 'IT/Digital/NonIT' %}\n       it_flg\n\
  \       {% elif filter_values('select_param_2')|first == '\u041F\u0440\u0438\u0447\
  \u0438\u043D\u0430 \u043F\u043E\u0438\u0441\u043A\u0430' %}\n       search_reason\n\
