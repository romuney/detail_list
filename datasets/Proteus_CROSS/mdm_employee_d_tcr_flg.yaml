  \ prod_proteus.mdm_employee_d_filter\nwhere foreign_tcr_flg=1\n\nunion all\n\nselect\
  \ distinct lvl1_legal_unit_nm\n, 3 as order_number\n, '\u0422\u0426\u0420 \u0420\
  \u0424 + \u0422\u0426\u0420 \u0421\u041D\u0413' as tcr_type\n, type_create_company\n\
  from prod_proteus.mdm_employee_d_filter\nwhere tcr_flg=1\n\nunion all\n\nselect\
  \ distinct lvl1_legal_unit_nm\n, 4 as order_number\n, '\u0412\u0441\u0435 \u042E\
  \u041B' as tcr_type\n, type_create_company\nfrom prod_proteus.mdm_employee_d_filter"
