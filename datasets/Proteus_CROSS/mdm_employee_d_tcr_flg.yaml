sql: "select distinct lvl1_legal_unit_nm\n, 1 as order_number\n, '\u0422\u0426\u0420\
  \ \u0420\u0424' as tcr_type\n, type_create_company\nfrom prod_proteus.mdm_employee_d_filter\n\
